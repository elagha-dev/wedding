# ============================================================
# netlify.toml — Netlify configuration
# ============================================================

[build]
  publish = "."          # Serve from the repo root (no build step needed)

# Enable Netlify Identity widget → powers the CMS login at /admin
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Required: CMS auth redirect
[[redirects]]
  from  = "/admin"
  to    = "/admin/index.html"
  status = 200
