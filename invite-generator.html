<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Arina & Elnur — Invite Link Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F3EE;
    --card: #FDFAF7;
    --ink: #2A201A;
    --muted: #7A6B5E;
    --accent: #7A5236;
    --accent-light: #C4956A;
    --border: #E2D8CF;
    --success: #4A7C59;
    --tag-ceremony: #E8E0D6;
    --tag-party: #F0E4D4;
    --serif: 'Cormorant Garamond', Georgia, serif;
    --sans: 'Jost', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px 80px;
  }

  /* ── Header ── */
  header {
    text-align: center;
    margin-bottom: 48px;
    max-width: 560px;
  }
  .monogram {
    font-family: var(--serif);
    font-size: 42px;
    font-weight: 300;
    letter-spacing: .18em;
    color: var(--accent);
    margin-bottom: 6px;
    font-style: italic;
  }
  header h1 {
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .header-rule {
    width: 40px;
    height: 1px;
    background: var(--accent-light);
    margin: 16px auto;
  }

  /* ── Main card ── */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 32px;
    width: 100%;
    max-width: 620px;
    box-shadow: 0 2px 24px rgba(42,32,26,.06);
  }

  .card + .card { margin-top: 20px; }

  .section-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── Name input row ── */
  .name-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
  }
  .field-group { display: flex; flex-direction: column; gap: 6px; }
  .field-group label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  input[type="text"] {
    font-family: var(--sans);
    font-size: 14px;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: var(--bg);
    color: var(--ink);
    transition: border-color .2s, box-shadow .2s;
    outline: none;
  }
  input[type="text"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(122,82,54,.1);
  }
  input[type="text"]::placeholder { color: #BEB2A8; }

  /* ── Invite type buttons ── */
  .type-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
    display: block;
  }
  .invite-types {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 24px;
  }
  .type-btn {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
    padding: 14px 16px;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
    transition: all .18s;
    text-align: left;
  }
  .type-btn:hover {
    border-color: var(--accent-light);
    background: #FBF6F0;
  }
  .type-btn.is-active {
    border-color: var(--accent);
    background: #FBF6F0;
    box-shadow: 0 0 0 2px rgba(122,82,54,.12);
  }
  .type-btn-icon { font-size: 20px; margin-bottom: 2px; }
  .type-btn-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    letter-spacing: .02em;
  }
  .type-btn-desc {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.4;
  }
  .type-btn.is-active .type-btn-title { color: var(--accent); }

  /* ── Generate button ── */
  .generate-btn {
    width: 100%;
    padding: 14px 24px;
    background: var(--accent);
    color: #FBF6F0;
    border: none;
    border-radius: 3px;
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .18em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background .2s, transform .1s;
  }
  .generate-btn:hover { background: #8E6042; }
  .generate-btn:active { transform: scale(.99); }

  /* ── Output area ── */
  .output-card {
    display: none;
  }
  .output-card.is-visible { display: block; }

  .guest-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 20px;
    background: var(--tag-ceremony);
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .guest-tag.has-party { background: var(--tag-party); }

  .url-box {
    display: flex;
    align-items: center;
    gap: 0;
    border: 1px solid var(--border);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 12px;
    background: var(--bg);
  }
  .url-text {
    flex: 1;
    padding: 11px 14px;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    color: var(--ink);
    word-break: break-all;
    line-height: 1.5;
    user-select: all;
    cursor: text;
  }
  .copy-btn {
    flex-shrink: 0;
    padding: 0 18px;
    height: 100%;
    min-height: 44px;
    background: var(--accent);
    color: #fff;
    border: none;
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background .2s;
    white-space: nowrap;
  }
  .copy-btn:hover { background: #8E6042; }
  .copy-btn.copied { background: var(--success); }

  .open-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 500;
    color: var(--accent);
    text-decoration: none;
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 8px 16px;
    transition: background .18s, border-color .18s;
    margin-top: 4px;
  }
  .open-btn:hover { background: #FBF6F0; border-color: var(--accent-light); }

  /* ── History list ── */
  .history-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .history-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    font-size: 13px;
  }
  .history-name {
    flex: 1;
    font-weight: 500;
    color: var(--ink);
  }
  .history-badges {
    display: flex;
    gap: 4px;
  }
  .badge {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 10px;
    background: var(--tag-ceremony);
    color: var(--muted);
  }
  .badge.party { background: var(--tag-party); color: var(--accent); }
  .badge.couple { background: #E6EEF0; color: #3A6070; }

  .history-copy {
    background: none;
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 5px 12px;
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
  }
  .history-copy:hover { border-color: var(--accent); color: var(--accent); }
  .history-copy.copied { border-color: var(--success); color: var(--success); }

  .empty-history {
    text-align: center;
    padding: 24px;
    color: var(--muted);
    font-size: 13px;
    font-style: italic;
    font-family: var(--serif);
  }

  /* ── Responsive ── */
  @media (max-width: 500px) {
    .name-row { grid-template-columns: 1fr; }
    .invite-types { grid-template-columns: 1fr 1fr; }
    .card { padding: 24px 18px; }
  }
</style>
</head>
<body>

<header>
  <div class="monogram">A & E</div>
  <div class="header-rule"></div>
  <h1>Wedding Invite Link Generator</h1>
</header>

<!-- Generator card -->
<div class="card">
  <div class="section-label">Guest Details</div>

  <div class="name-row">
    <div class="field-group">
      <label for="p1">First Guest Name</label>
      <input type="text" id="p1" placeholder="e.g. Sarah" />
    </div>
    <div class="field-group" id="p2Group">
      <label for="p2">Second Guest (optional)</label>
      <input type="text" id="p2" placeholder="e.g. Michael" />
    </div>
  </div>

  <span class="type-label">Invite Type</span>
  <div class="invite-types">
    <button class="type-btn is-active" data-type="ceremony-single">
      <span class="type-btn-icon">💒</span>
      <span class="type-btn-title">Single — Ceremony</span>
      <span class="type-btn-desc">One guest, ceremony only</span>
    </button>
    <button class="type-btn" data-type="couple-ceremony">
      <span class="type-btn-icon">👫</span>
      <span class="type-btn-title">Couple — Ceremony</span>
      <span class="type-btn-desc">Two guests, ceremony only</span>
    </button>
    <button class="type-btn" data-type="ceremony-party-single">
      <span class="type-btn-icon">🎉</span>
      <span class="type-btn-title">Single — Ceremony + Party</span>
      <span class="type-btn-desc">One guest, full day</span>
    </button>
    <button class="type-btn" data-type="couple-party">
      <span class="type-btn-icon">✨</span>
      <span class="type-btn-title">Couple — Ceremony + Party</span>
      <span class="type-btn-desc">Two guests, full day</span>
    </button>
  </div>

  <button class="generate-btn" id="generateBtn">Generate Invite Link →</button>
</div>

<!-- Output card -->
<div class="card output-card" id="outputCard">
  <div class="section-label">Your Link</div>
  <div id="guestTagWrap"></div>
  <div class="url-box">
    <div class="url-text" id="urlDisplay"></div>
    <button class="copy-btn" id="copyBtn">Copy</button>
  </div>
  <a class="open-btn" id="openBtn" href="#" target="_blank" rel="noreferrer">
    ↗ Preview invite
  </a>
</div>

<!-- History card -->
<div class="card" style="margin-top:20px">
  <div class="section-label">Generated Links</div>
  <ul class="history-list" id="historyList">
    <li class="empty-history">No links generated yet — create your first above ↑</li>
  </ul>
</div>

<script>
  // ── Config ─────────────────────────────────────────────
  // Change this to your actual wedding site URL when deployed!
  var BASE_URL = 'https://www.arinaelnur.de/';

  // ── State ───────────────────────────────────────────────
  var selectedType = 'ceremony-single';
  var history = [];

  // ── Type button toggle ──────────────────────────────────
  document.querySelectorAll('.type-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.type-btn').forEach(function(b) {
        b.classList.remove('is-active');
      });
      btn.classList.add('is-active');
      selectedType = btn.dataset.type;

      // Show/hide second name field
      var needsP2 = selectedType === 'couple-ceremony' || selectedType === 'couple-party';
      document.getElementById('p2').placeholder = needsP2 ? 'e.g. Michael' : 'optional';
    });
  });

  // ── Build URL ───────────────────────────────────────────
  function buildUrl(p1, p2, type) {
    var params = new URLSearchParams();
    if (p1) params.set('p1', p1);
    if (p2 && (type === 'couple-ceremony' || type === 'couple-party')) {
      params.set('p2', p2);
    }
    if (type === 'ceremony-party-single' || type === 'couple-party') {
      params.set('party', '1');
    }
    return BASE_URL + '?' + params.toString();
  }

  // ── Generate ────────────────────────────────────────────
  document.getElementById('generateBtn').addEventListener('click', function() {
    var p1 = document.getElementById('p1').value.trim();
    var p2 = document.getElementById('p2').value.trim();

    if (!p1) {
      document.getElementById('p1').focus();
      document.getElementById('p1').style.borderColor = '#C0392B';
      setTimeout(function() {
        document.getElementById('p1').style.borderColor = '';
      }, 1500);
      return;
    }

    var url = buildUrl(p1, p2, selectedType);

    // Show output
    var outputCard = document.getElementById('outputCard');
    outputCard.classList.add('is-visible');

    document.getElementById('urlDisplay').textContent = url;
    document.getElementById('openBtn').href = url;

    // Guest tag
    var isCouple = selectedType === 'couple-ceremony' || selectedType === 'couple-party';
    var hasParty = selectedType === 'ceremony-party-single' || selectedType === 'couple-party';
    var guestTagWrap = document.getElementById('guestTagWrap');
    var tagName = isCouple && p2 ? (p1 + ' & ' + p2) : p1;
    guestTagWrap.innerHTML = '<span class="guest-tag' + (hasParty ? ' has-party' : '') + '">' +
      (isCouple ? '👫' : '👤') + ' ' + tagName +
      (hasParty ? ' · Ceremony + Party' : ' · Ceremony only') +
      '</span>';

    // Reset copy button
    var copyBtn = document.getElementById('copyBtn');
    copyBtn.textContent = 'Copy';
    copyBtn.classList.remove('copied');

    // Scroll to output
    outputCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

    // Add to history (avoid duplicates)
    var existing = history.findIndex(function(h) { return h.url === url; });
    if (existing === -1) {
      history.unshift({ name: tagName, type: selectedType, url: url, hasParty: hasParty, isCouple: isCouple });
      renderHistory();
    }
  });

  // ── Copy ────────────────────────────────────────────────
  document.getElementById('copyBtn').addEventListener('click', function() {
    var url = document.getElementById('urlDisplay').textContent;
    copyToClipboard(url, this);
  });

  function copyToClipboard(text, btn) {
    navigator.clipboard.writeText(text).then(function() {
      var orig = btn.textContent;
      btn.textContent = '✓ Copied';
      btn.classList.add('copied');
      setTimeout(function() {
        btn.textContent = orig === '✓ Copied' ? 'Copy' : orig;
        btn.classList.remove('copied');
      }, 2000);
    });
  }

  // ── History ─────────────────────────────────────────────
  function renderHistory() {
    var list = document.getElementById('historyList');
    if (history.length === 0) {
      list.innerHTML = '<li class="empty-history">No links generated yet — create your first above ↑</li>';
      return;
    }
    list.innerHTML = history.map(function(h, i) {
      return '<li class="history-item">' +
        '<span class="history-name">' + h.name + '</span>' +
        '<span class="history-badges">' +
          (h.isCouple ? '<span class="badge couple">Couple</span>' : '') +
          (h.hasParty ? '<span class="badge party">+ Party</span>' : '') +
        '</span>' +
        '<button class="history-copy" data-idx="' + i + '">Copy</button>' +
      '</li>';
    }).join('');

    list.querySelectorAll('.history-copy').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var idx = parseInt(this.dataset.idx);
        copyToClipboard(history[idx].url, this);
      });
    });
  }

  renderHistory();
</script>
</body>
</html>
