<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>A & E · Invite Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F3EE;--card:#FDFAF7;--ink:#2A201A;--muted:#7A6B5E;
  --accent:#7A5236;--al:#C4956A;--border:#E2D8CF;
  --green:#2e7d52;--green-bg:#EBF3ED;--green-mid:#4caf7d;
  --amber:#a06020;--amber-bg:#FEF3E2;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Jost',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:32px 14px 80px}
header{text-align:center;margin-bottom:32px}
.mono{font-family:var(--serif);font-size:38px;font-weight:300;letter-spacing:.18em;color:var(--accent);font-style:italic}
.rule{width:36px;height:1px;background:var(--al);margin:10px auto}
header h1{font-size:10px;font-weight:600;letter-spacing:.25em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--border);padding:24px 28px;width:100%;max-width:620px;box-shadow:0 2px 20px rgba(42,32,26,.06);margin-top:18px}
.slabel{font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.slabel::after{content:'';flex:1;height:1px;background:var(--border)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
input{font-family:var(--sans);font-size:14px;padding:9px 12px;border:1px solid var(--border);background:var(--bg);color:var(--ink);outline:none;width:100%;transition:border-color .18s}
input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(122,82,54,.1)}
input::placeholder{color:#c0b5aa}
.tlabel{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:9px;display:block}
.types{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px}
.tbtn{display:flex;flex-direction:column;gap:2px;padding:11px 13px;background:var(--bg);border:1.5px solid var(--border);cursor:pointer;text-align:left;transition:all .15s}
.tbtn:hover{border-color:var(--al);background:#fbf6f0}
.tbtn.on{border-color:var(--accent);background:#fbf6f0}
.tbtn-icon{font-size:17px}
.tbtn-title{font-size:11.5px;font-weight:600;color:var(--ink)}
.tbtn.on .tbtn-title{color:var(--accent)}
.tbtn-desc{font-size:10px;color:var(--muted)}
.langs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:18px}
.lbtn{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;background:var(--bg);border:1.5px solid var(--border);cursor:pointer;font-family:var(--sans);font-size:12px;font-weight:500;color:var(--muted);transition:all .15s}
.lbtn:hover{border-color:var(--al);background:#fbf6f0}
.lbtn.on{border-color:var(--accent);background:#fbf6f0;color:var(--accent)}
.genbtn{width:100%;padding:13px;background:var(--accent);color:#fbf6f0;border:none;font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;transition:background .18s}
.genbtn:hover{background:#8e6042}

/* output */
.gtag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;background:#e8e0d6;font-size:11px;font-weight:500;color:var(--muted);margin-bottom:12px}
.gtag.p{background:#f0e4d4}
.urlrow{display:flex;border:1px solid var(--border);margin-bottom:8px}
.urltext{flex:1;font-size:11px;padding:9px 12px;color:var(--muted);font-family:monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ubtn{flex-shrink:0;padding:9px 13px;border:none;font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:all .18s;white-space:nowrap}
.ubtn-copy{background:var(--ink);color:#ebe2da}
.ubtn-copy:hover{background:var(--accent)}
.ubtn-copy.ok{background:var(--green)}
.ubtn-sent{background:#e8e0d6;color:var(--muted)}
.ubtn-sent:hover{background:var(--al);color:var(--ink)}
.ubtn-sent.ok{background:var(--green);color:#fff}
.previewlink{display:block;font-size:10.5px;color:var(--muted);text-decoration:none;letter-spacing:.06em;margin-bottom:16px}
.previewlink:hover{color:var(--accent)}
.mlabel{font-size:10px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.msgbox{background:var(--bg);border:1px solid var(--border);padding:13px 15px;font-family:var(--serif);font-size:13px;line-height:1.8;color:var(--ink);white-space:pre-wrap;word-break:break-word;margin-bottom:9px;max-height:220px;overflow-y:auto;width:100%;resize:vertical;outline:none;transition:border-color .18s}
.msgbox:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(122,82,54,.1)}
.mactions{display:flex;gap:9px}
.mbtn{flex:1;padding:10px 12px;border:none;font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:all .18s;display:flex;align-items:center;justify-content:center;gap:6px}
.mbtn-copy{background:var(--ink);color:#ebe2da}
.mbtn-copy:hover{background:var(--accent)}
.mbtn-copy.ok{background:var(--green)}
.mbtn-wa{background:#25d366;color:#fff}
.mbtn-wa:hover{background:#1db954}

/* ── TRACKER ──────────────────────────────────────────────── */
.tracker-hdr{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.tracker-hdr .slabel{margin-bottom:0;flex:1}
.clrbtn{font-size:11px;color:#bbb;background:none;border:none;cursor:pointer;font-family:var(--sans)}
.clrbtn:hover{color:var(--accent)}

/* Summary strip */
.sum-strip{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border);margin-bottom:16px;overflow:hidden}
.sum-cell{background:var(--card);padding:10px 14px;text-align:center}
.sum-num{font-family:var(--serif);font-size:26px;font-weight:300;line-height:1;color:var(--ink)}
.sum-cell.sent .sum-num{color:var(--green)}
.sum-cell.unsent .sum-num{color:var(--amber)}
.sum-lbl{font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.sum-bar-wrap{height:3px;background:var(--border);margin-bottom:16px}
.sum-bar{height:100%;background:var(--green);transition:width .4s ease}

/* Group headers */
.group-hdr{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:10px 0 6px;color:var(--accent);border-bottom:1px solid var(--border);margin-bottom:2px;list-style:none}
.group-hdr.gh-sent{color:var(--green)}

/* Guest card */
.hlist{list-style:none;display:flex;flex-direction:column;gap:6px}
.empty{text-align:center;padding:28px;color:var(--muted);font-size:13px;font-style:italic;font-family:var(--serif)}

.hi{background:var(--bg);border:1px solid var(--border);padding:12px 14px;transition:border-color .15s}
.hi.hi-sent{border-left:3px solid var(--green-mid)}
.hi.hi-unsent{border-left:3px solid var(--al)}

/* Guest name row */
.hi-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.hi-name{font-family:var(--serif);font-size:17px;font-weight:400;flex:1}
.hi-sent .hi-name{color:var(--muted)}
.hi-meta-chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;border-radius:0}
.chip-couple{background:#e4ebf0;color:#3a5a6e}
.chip-party{background:#f0e4d4;color:var(--accent)}
.chip-lang{background:#e8e0d6;color:var(--muted)}

/* Status pipeline */
.pipeline{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.pip-step{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px;border:1.5px solid var(--border);background:var(--card);cursor:pointer;transition:all .15s;user-select:none;position:relative}
.pip-step:hover{border-color:var(--al)}
.pip-step.done{border-color:var(--green-mid);background:var(--green-bg)}
.pip-step.done:hover{border-color:var(--green)}
.pip-icon{font-size:16px;line-height:1}
.pip-label{font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center}
.pip-step.done .pip-label{color:var(--green)}
.pip-time{font-size:8px;color:#a09080;text-align:center;font-variant-numeric:tabular-nums}
.pip-check{position:absolute;top:4px;right:5px;font-size:10px;color:var(--green-mid);opacity:0;transition:opacity .15s}
.pip-step.done .pip-check{opacity:1}

/* Footer row */
.hi-footer{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hi-url{font-family:monospace;font-size:9px;color:#c0b0a0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.hi-actions{display:flex;gap:5px;flex-shrink:0}
.act-btn{padding:4px 9px;font-size:9px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;font-family:var(--sans);transition:all .13s;white-space:nowrap}
.act-btn:hover{border-color:var(--al);color:var(--accent);background:#fbf6f0}
.act-btn.del-btn:hover{border-color:#c0392b;color:#c0392b;background:#fdf5f5}

/* Sender toggle */
.sender-toggle{display:flex;gap:6px;margin-top:2px}
.sbtn{flex:1;padding:8px;background:var(--bg);border:1.5px solid var(--border);cursor:pointer;font-family:var(--sans);font-size:12px;font-weight:500;color:var(--muted);transition:all .15s}
.sbtn:hover{border-color:var(--al)}
.sbtn.on{border-color:var(--accent);background:#fbf6f0;color:var(--accent);font-weight:600}

/* Sender chip on tracker card */
.chip-arina{background:#fce8f0;color:#9b3060}
.chip-elnur{background:#e8eef8;color:#2a4a8a}

/* Notion import card */
.import-card{border:1.5px dashed var(--border);padding:20px 24px;cursor:pointer;transition:border-color .18s;text-align:center}
.import-card:hover{border-color:var(--al)}
.import-card input[type=file]{display:none}
.import-icon{font-size:22px;margin-bottom:8px}
.import-title{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.import-desc{font-size:11px;color:#b0a090}
.import-queue{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.iq-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border:1px solid var(--border)}
.iq-name{font-family:var(--serif);font-size:15px;flex:1}
.iq-phone{font-size:10px;color:var(--muted);font-family:monospace}
.iq-sender{font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px}
.iq-wa{padding:6px 10px;background:#25d366;color:#fff;border:none;font-size:10px;font-weight:600;font-family:var(--sans);cursor:pointer;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;transition:background .15s}
.iq-wa:hover{background:#1db954}
.iq-wa.done{background:var(--green)}
.iq-skip{background:none;border:none;color:#ccc;font-size:14px;cursor:pointer;padding:4px}
.iq-skip:hover{color:#c0392b}
.import-actions{display:flex;gap:8px;margin-top:14px}
.import-clear{flex:1;padding:9px;background:none;border:1px solid var(--border);font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.import-clear:hover{border-color:#c0392b;color:#c0392b}
.filter-bar{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.fbtn{padding:5px 10px;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--border);background:var(--bg);color:var(--muted);cursor:pointer;font-family:var(--sans);transition:all .13s}
.fbtn.on{background:var(--ink);color:#ebe2da;border-color:var(--ink)}

/* Collective invite */
.iq-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border:1px solid var(--border);transition:opacity .2s,background .15s;cursor:pointer;user-select:none}
.iq-row.sent{opacity:.38}
.iq-row.selected{background:#f5ede4;border-color:var(--al)}
.iq-check{width:18px;height:18px;border:1.5px solid var(--border);border-radius:0;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .15s;background:var(--card)}
.iq-row.selected .iq-check{background:var(--accent);border-color:var(--accent);color:#fff}
.iq-row.sent .iq-check{background:#e8e0d6;border-color:#d0c8c0}
.group-send-bar{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--border);margin-top:6px}
.group-send-count{font-size:11px;color:var(--muted);flex:1}
.group-send-btn{padding:9px 16px;background:var(--accent);color:#fbf6f0;border:none;font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:background .15s}
.group-send-btn:hover{background:#8e6042}
.group-send-btn:disabled{background:#c0b0a0;cursor:default}
.group-deselect{padding:9px 12px;background:none;border:1px solid var(--border);font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.group-deselect:hover{border-color:var(--accent);color:var(--accent)}

/* Phone picker modal */
.phone-modal-backdrop{position:fixed;inset:0;background:rgba(42,32,26,.45);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.phone-modal{background:var(--card);width:100%;max-width:480px;padding:24px 20px 32px;border-top:2px solid var(--accent)}
.phone-modal-title{font-family:var(--serif);font-size:18px;margin-bottom:4px}
.phone-modal-sub{font-size:11px;color:var(--muted);margin-bottom:16px}
.phone-option{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1.5px solid var(--border);margin-bottom:8px;cursor:pointer;transition:all .15s;background:var(--bg)}
.phone-option:hover{border-color:var(--al);background:#fbf6f0}
.phone-option-name{font-family:var(--serif);font-size:15px;flex:1}
.phone-option-num{font-family:monospace;font-size:11px;color:var(--muted)}
.phone-option-select{width:16px;height:16px;border:1.5px solid var(--border);flex-shrink:0}
.phone-modal-cancel{width:100%;margin-top:8px;padding:11px;background:none;border:1px solid var(--border);font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);cursor:pointer}

@media(max-width:480px){
  .row2{grid-template-columns:1fr}
  .types{grid-template-columns:1fr}
  .card{padding:18px 14px}
  .mactions{flex-direction:column}
  .pipeline{grid-template-columns:repeat(3,1fr);gap:4px}
  .pip-step{padding:7px 4px}
}
</style>
</head>
<body>
<header>
  <div class="mono">A & E</div>
  <div class="rule"></div>
  <h1>Invite Generator</h1>
</header>

<div class="card" id="genCard">
  <div class="slabel">Guest Details</div>
  <div class="row2">
    <div class="fg"><label for="p1">First Guest *</label><input id="p1" type="text" placeholder="e.g. Sarah"/></div>
    <div class="fg"><label for="p2">Second Guest (couple)</label><input id="p2" type="text" placeholder="optional"/></div>
  </div>
  <div class="row2" style="margin-bottom:18px">
    <div class="fg"><label for="waPhone">WhatsApp Number</label><input id="waPhone" type="tel" placeholder="+49 176 12345678"/></div>
    <div class="fg">
      <label>Sender</label>
      <div class="sender-toggle">
        <button class="sbtn on" data-sender="Arina">Arina</button>
        <button class="sbtn" data-sender="Elnur">Elnur</button>
      </div>
    </div>
  </div>

  <span class="tlabel">Invite Type</span>
  <div class="types">
    <button class="tbtn on" data-type="ceremony-single"><span class="tbtn-icon">💒</span><span class="tbtn-title">Single — Ceremony</span><span class="tbtn-desc">Church only</span></button>
    <button class="tbtn" data-type="couple-ceremony"><span class="tbtn-icon">👫</span><span class="tbtn-title">Couple — Ceremony</span><span class="tbtn-desc">Church only</span></button>
    <button class="tbtn" data-type="ceremony-party-single"><span class="tbtn-icon">🎉</span><span class="tbtn-title">Single — Full Day</span><span class="tbtn-desc">Church + evening</span></button>
    <button class="tbtn" data-type="couple-party"><span class="tbtn-icon">✨</span><span class="tbtn-title">Couple — Full Day</span><span class="tbtn-desc">Church + evening</span></button>
  </div>

  <span class="tlabel">Language</span>
  <div class="langs">
    <button class="lbtn on" data-lang="en">🇬🇧 English</button>
    <button class="lbtn" data-lang="de">🇩🇪 Deutsch</button>
    <button class="lbtn" data-lang="ru">🇷🇺 Русский</button>
  </div>
  <button class="genbtn" id="genBtn">Generate Invite →</button>
</div>

<div class="card" id="outCard" style="display:none">
  <div class="slabel">Invite Link</div>
  <div id="guestTag"></div>
  <div class="urlrow">
    <div class="urltext" id="urlTxt"></div>
    <button class="ubtn ubtn-copy" id="copyLinkBtn">Copy Link</button>
    <button class="ubtn ubtn-sent" id="sentBtn">Mark Sent</button>
  </div>
  <a class="previewlink" id="previewLink" href="#" target="_blank" rel="noreferrer">↗ Open invite</a>
  <div class="mlabel">Message <span style="font-size:9px;font-weight:400;letter-spacing:0;text-transform:none;color:#b0a090">— editable</span></div>
  <textarea class="msgbox" id="msgBox"></textarea>
  <div class="mactions">
    <button class="mbtn mbtn-copy" id="copyMsgBtn">📋 Copy Message</button>
    <button class="mbtn mbtn-wa" id="waSendBtn">💬 Send via WhatsApp</button>
  </div>
</div>

<div class="card">
  <div class="slabel">Sync from Notion</div>
  <div style="display:flex;gap:10px;align-items:flex-end;margin-bottom:14px">
    <div class="fg" style="flex:1">
      <label for="workerUrl">Cloudflare Worker URL</label>
      <input id="workerUrl" type="text" placeholder="https://wedding.your-name.workers.dev" />
    </div>
    <button class="genbtn" id="syncBtn" style="width:auto;padding:13px 20px;white-space:nowrap">⟳ Sync</button>
  </div>
  <div id="syncStatus" style="font-size:11px;color:var(--muted);margin-bottom:10px;display:none"></div>
  <div id="importQueue" style="display:none">
    <div class="filter-bar" id="importFilterBar"></div>
    <div class="import-queue" id="importQueueList"></div>
    <div class="group-send-bar" id="groupSendBar" style="display:none">
      <span class="group-send-count" id="groupSendCount">0 selected</span>
      <button class="group-deselect" id="groupDeselect">Deselect all</button>
      <button class="group-send-btn" id="groupSendBtn">💬 Send invite</button>
    </div>
    <div class="import-actions">
      <button class="import-clear" id="importClear">Clear list</button>
    </div>
  </div>
</div>

<!-- Phone picker modal -->
<div class="phone-modal-backdrop" id="phoneModal" style="display:none">
  <div class="phone-modal">
    <div class="phone-modal-title">Who's number to use?</div>
    <div class="phone-modal-sub" id="phoneModalSub"></div>
    <div id="phoneModalOptions"></div>
    <button class="phone-modal-cancel" id="phoneModalCancel">Cancel</button>
  </div>
</div>

<div class="card" id="trackerCard">
  <div class="tracker-hdr">
    <div class="slabel" style="margin-bottom:0;flex:1">Tracker</div>
    <button class="clrbtn" id="clearBtn">Clear all</button>
  </div>
  <div id="trackerSummary" style="display:none"></div>
  <ul class="hlist" id="hlist"></ul>
</div>

<script>
var BASE = 'https://www.arinaelnur.de/';
var selType = 'ceremony-single';
var selLang = 'en';
var selSender = 'Arina';
var cur = null;

var mem = [];
function load(){
  try{ var d=localStorage.getItem('wt'); return d?JSON.parse(d):[]; }
  catch(e){ return []; }
}
function save(){
  try{ localStorage.setItem('wt',JSON.stringify(mem)); } catch(e){}
}
mem = load();

var msgs = {

function buildUrl(p1,p2,type,lang){
  var q=new URLSearchParams();
  if(p1) q.set('p1',p1);
  if(p2&&(type==='couple-ceremony'||type==='couple-party')) q.set('p2',p2);
  if(type==='ceremony-party-single'||type==='couple-party') q.set('party','1');
  if(lang&&lang!=='en') q.set('lang',lang);
  return BASE+'?'+q.toString();
}

function buildMsg(name,type,lang,url){
  var hasParty=type==='ceremony-party-single'||type==='couple-party';
  var l=msgs[lang]||msgs.en;
  return (hasParty?l.party:l.ceremony).replace('{n}',name).replace('{u}',url);
}

function ts(){ return new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
function dt(){ return new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' '+ts(); }

function copyText(text,btn,resetLabel){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){flash(btn,resetLabel);}).catch(function(){fallbackCopy(text,btn,resetLabel);});
  } else { fallbackCopy(text,btn,resetLabel); }
}
function fallbackCopy(text,btn,resetLabel){
  var ta=document.createElement('textarea');
  ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{document.execCommand('copy'); flash(btn,resetLabel);}catch(e){}
  document.body.removeChild(ta);
}
function flash(btn,resetLabel){
  btn.textContent='✓ Copied'; btn.classList.add('ok');
  setTimeout(function(){btn.textContent=resetLabel; btn.classList.remove('ok');},2000);
}

var trackerFilter = 'all';
function renderTracker(){
  var list=document.getElementById('hlist');
  if(!mem.length){
    document.getElementById('trackerSummary').style.display='none';
    list.innerHTML='<li class="empty">No invites yet — generate your first above ↑</li>';
    return;
  }

  // Filter bar
  var filterBar=document.getElementById('trackerSummary').previousElementSibling;
  var existingFilterBar=document.getElementById('trackerFilterBar');
  if(!existingFilterBar){
    var fb=document.createElement('div');
    fb.id='trackerFilterBar';
    fb.className='filter-bar';
    fb.style.marginBottom='12px';
    document.getElementById('trackerCard').insertBefore(fb, document.getElementById('trackerSummary'));
    existingFilterBar=fb;
  }
  var senders=['all','Arina','Elnur'];
  existingFilterBar.innerHTML=senders.map(function(s){
    return '<button class="fbtn'+(trackerFilter===s?' on':'')+'" data-f="'+s+'">'+(s==='all'?'All':s)+'</button>';
  }).join('');
  existingFilterBar.querySelectorAll('.fbtn').forEach(function(b){
    b.addEventListener('click',function(){trackerFilter=this.dataset.f;renderTracker();});
  });

  var filtered=trackerFilter==='all'?mem:mem.filter(function(h){return h.sender===trackerFilter;});
  var sent=filtered.filter(function(h){return !!h.tracked.waSent;});
  var unsent=filtered.filter(function(h){return !h.tracked.waSent;});
  var total=filtered.length;
  var pct=total?Math.round(sent.length/total*100):0;

  var sumEl=document.getElementById('trackerSummary');
  sumEl.style.display='block';
  sumEl.innerHTML=
    '<div class="sum-strip">'+
      '<div class="sum-cell sent"><div class="sum-num">'+sent.length+'</div><div class="sum-lbl">✓ Sent</div></div>'+
      '<div class="sum-cell unsent"><div class="sum-num">'+unsent.length+'</div><div class="sum-lbl">⏳ Pending</div></div>'+
      '<div class="sum-cell"><div class="sum-num">'+total+'</div><div class="sum-lbl">Total</div></div>'+
    '</div>'+
    '<div class="sum-bar-wrap"><div class="sum-bar" style="width:'+pct+'%"></div></div>';

  function renderGroup(items){
    return items.map(function(h){
      var i=mem.indexOf(h);
      var t=h.tracked||{};
      var isSent=!!t.waSent;
      var senderClass=h.sender==='Elnur'?'chip-elnur':'chip-arina';

      function pipStep(key, icon, label){
        var done=!!t[key];
        return '<div class="pip-step'+(done?' done':'')+'" data-i="'+i+'" data-k="'+key+'" title="Click to toggle">'+
          '<span class="pip-check">✓</span>'+
          '<span class="pip-icon">'+icon+'</span>'+
          '<span class="pip-label">'+label+'</span>'+
          (done && t[key] ? '<span class="pip-time">'+t[key]+'</span>' : '<span class="pip-time">—</span>')+
        '</div>';
      }

      return '<li class="hi '+(isSent?'hi-sent':'hi-unsent')+'">'+
        '<div class="hi-top">'+
          '<span class="hi-name">'+h.name+'</span>'+
          '<div class="hi-meta-chips">'+
            (h.isCouple?'<span class="chip chip-couple">Couple</span>':'')+
            (h.hasParty?'<span class="chip chip-party">Full Day</span>':'')+
            '<span class="chip chip-lang">'+(h.ll||'EN')+'</span>'+
            (h.sender?'<span class="chip '+senderClass+'">'+h.sender+'</span>':'')+
          '</div>'+
        '</div>'+
        '<div class="pipeline">'+
          pipStep('linkCopied','🔗','Link Copied')+
          pipStep('msgCopied','📋','Msg Copied')+
          pipStep('waSent','💬','WA Sent')+
        '</div>'+
        '<div class="hi-footer">'+
          '<span class="hi-url">'+h.url+'</span>'+
          '<div class="hi-actions">'+
            '<button class="act-btn resend-btn" data-i="'+i+'">📤 Resend</button>'+
            '<button class="act-btn del-btn" data-i="'+i+'">✕</button>'+
          '</div>'+
        '</div>'+
      '</li>';
    }).join('');
  }

  var html='';
  if(unsent.length){
    html+='<li class="group-hdr">⏳ Pending ('+unsent.length+')</li>';
    html+=renderGroup(unsent);
  }
  if(sent.length){
    html+='<li class="group-hdr gh-sent">✓ Sent ('+sent.length+')</li>';
    html+=renderGroup(sent);
  }
  list.innerHTML=html;

  // Pipeline step toggles
  list.querySelectorAll('.pip-step[data-k]').forEach(function(b){
    b.addEventListener('click',function(){
      var i=parseInt(this.dataset.i), k=this.dataset.k;
      var e=mem[i]; if(!e) return;
      e.tracked[k]=e.tracked[k]?null:ts();
      if(cur&&cur.url===e.url&&k==='waSent'){
        var sb=document.getElementById('sentBtn');
        if(e.tracked.waSent){sb.textContent='✓ Sent';sb.classList.add('ok');}
        else{sb.textContent='Mark Sent';sb.classList.remove('ok');}
      }
      save(); renderTracker();
    });
  });

  // Delete
  list.querySelectorAll('.del-btn').forEach(function(b){
    b.addEventListener('click',function(){
      var i=parseInt(this.dataset.i);
      var entry=mem[i]; if(!entry) return;
      if(cur&&cur.url===entry.url){
        cur=null;
        document.getElementById('outCard').style.display='none';
      }
      mem.splice(i,1);
      save(); renderTracker();
    });
  });

  // Resend WA
  list.querySelectorAll('.resend-btn').forEach(function(b){
    b.addEventListener('click',function(){
      var i=parseInt(this.dataset.i);
      var e=mem[i]; if(!e) return;
      var clean=(e.phone||'').replace(/[\s\-\(\)]/g,'').replace(/^\+/,'');
      var waUrl=clean
        ?'https://wa.me/'+clean+'?text='+encodeURIComponent(e.msg)
        :'https://wa.me/?text='+encodeURIComponent(e.msg);
      window.open(waUrl,'_blank');
      e.tracked.waSent=ts();
      save(); renderTracker();
    });
  });
}

// ── Send group invite ─────────────────────────────────────────
function sendGroupInvite(guestList, phone){
  var ll = {en:'🇬🇧 EN',de:'🇩🇪 DE',ru:'🇷🇺 RU'};
  var type  = guestList[0].type;
  var lang  = guestList[0].lang||'en';
  var names = guestList.map(function(g){return g.name;});
  var combinedName = names.length>1
    ? names.slice(0,-1).join(', ')+' & '+names[names.length-1]
    : names[0];

  var hasParty  = type==='ceremony-party-single'||type==='couple-party';
  var isCouple  = type==='couple-ceremony'||type==='couple-party';

  var url = buildUrl(guestList[0].name, '', type, lang);
  var msg = buildMsg(combinedName, type, lang, url);

  var existing = mem.findIndex(function(h){ return h.url===url; });
  var entry;
  if(existing>-1){ entry=mem[existing]; entry.name=combinedName; }
  else {
    entry={id:Date.now(),name:combinedName,type:type,lang:lang,ll:ll[lang]||'EN',
      url:url,msg:msg,phone:phone,isCouple:isCouple,hasParty:hasParty,
      sender:guestList[0].sender,collective:names,
      created:dt(),tracked:{linkCopied:null,msgCopied:null,waSent:null}};
    mem.unshift(entry);
  }

  var clean=(phone||'').replace(/[\s\-\(\)]/g,'').replace(/^\+/,'');
  var waUrl=clean
    ?'https://wa.me/'+clean+'?text='+encodeURIComponent(msg)
    :'https://wa.me/?text='+encodeURIComponent(msg);
  window.open(waUrl,'_blank');
  entry.tracked.waSent=ts();

  // Save to KV
  var workerUrl = document.getElementById('workerUrl').value.trim();
  if(workerUrl){
    fetch(workerUrl+'/sent', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({names:names})
    }).catch(function(){});
  }

  // Save sent status to KV (shared across devices)
  var workerUrl = workerInput.value.trim();
  var sentTime  = ts();
  guestList.forEach(function(g){
    fetch(workerUrl+'?action=setSent', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        name: g.name, sent: true,
        sentAt: sentTime, sender: g.sender,
        collective: guestList.length>1 ? guestList.map(function(x){return x.name;}) : null
      })
    });
  });

  // Mark all selected guests as sent
  guestList.forEach(function(g){ g.sent=true; g.collectiveWith=names; });
  selectedIdxs=[];
  save(); renderTracker(); renderImportQueue();
}

        '</div>'+
        (g.phone?'<div class="iq-phone">'+g.phone+'</div>':'')+
        '<span class="chip '+senderClass+'" style="flex-shrink:0">'+g.sender+'</span>'+
        (g.sent
          ? '<button class="iq-wa done iq-undo" data-qi="'+realIdx+'">✓ Undo</button>'
          : '')+
        '<button class="iq-skip" data-qi="'+realIdx+'" title="Remove">✕</button>'+
      '</div>';
    }).join('');

    // Row click → toggle selection (only for unsent)
    listEl.querySelectorAll('.iq-row').forEach(function(row){
      row.addEventListener('click', function(e){
        if(e.target.classList.contains('iq-skip')||
           e.target.classList.contains('iq-undo')||
           e.target.classList.contains('iq-wa')) return;
        var qi=parseInt(this.dataset.qi);
        if(importQueue[qi]&&importQueue[qi].sent) return; // can't select sent
        toggleSelect(qi);
      });
    });

    // Undo button
    listEl.querySelectorAll('.iq-undo').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var qi = parseInt(this.dataset.qi);
        var g  = importQueue[qi]; if(!g) return;

        var isCollective = g.collectiveWith && g.collectiveWith.length > 1;
        var msg = isCollective
          ? 'This will unmark '+g.collectiveWith.length+' guests as sent ('+g.collectiveWith.join(', ')+').\n\nContinue?'
          : 'Unmark "'+g.name+'" as sent?';

        if(!confirm(msg)) return;

        // Unmark all guests in collective
        importQueue.forEach(function(guest){
          if(g.collectiveWith && g.collectiveWith.indexOf(guest.name)>-1){
            guest.sent=false; guest.collectiveWith=null;
          }
        });
        if(!isCollective){ g.sent=false; }

        // Unmark in tracker
        var url = buildUrl(g.name, '', g.type, g.lang||'en');
        var existing = mem.findIndex(function(h){ return h.url===url; });
        if(existing>-1){ mem[existing].tracked.waSent=null; }

        // Remove from KV
        var workerUrl = document.getElementById('workerUrl').value.trim();
        if(workerUrl){
          fetch(workerUrl+'/unsent', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({names: isCollective ? g.collectiveWith : [g.name]})
          }).catch(function(){});
        }

        save(); renderTracker(); renderRows(filter);
        updateGroupBar();
      });
    });

    // Skip/remove
    listEl.querySelectorAll('.iq-skip').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var qi = parseInt(this.dataset.qi);
        importQueue.splice(qi,1);
        selectedIdxs = selectedIdxs.filter(function(i){return i!==qi;}).map(function(i){return i>qi?i-1:i;});
        renderImportQueue();
      });
    });

    updateGroupBar();
  }

  // Filter bar
  filterBarEl.innerHTML = ['all','Arina','Elnur'].map(function(s){
    return '<button class="fbtn'+(importFilter===s?' on':'')+'" data-f="'+s+'">'+(s==='all'?'All':s)+'</button>';
  }).join('');
  filterBarEl.querySelectorAll('.fbtn').forEach(function(b){
    b.addEventListener('click', function(){
      importFilter=this.dataset.f;
      selectedIdxs=[];
      renderRows(importFilter);
      filterBarEl.querySelectorAll('.fbtn').forEach(function(x){x.classList.remove('on');});
      this.classList.add('on');
    });
  });

  renderRows(importFilter);
}

document.getElementById('syncBtn').addEventListener('click', function(){ doSync(); });

async function doSync(){
  var url = document.getElementById('workerUrl').value.trim();
  if(!url) return;
  saveWorkerUrl(url);

  var statusEl = document.getElementById('syncStatus');
  var btn = document.getElementById('syncBtn');
  statusEl.style.display='block';
  statusEl.textContent='Syncing from Notion…';
  btn.textContent='…'; btn.disabled=true;

  try {
    var res  = await fetch(url, { method:'GET' });
    var data = await res.json();
    if(data.error) throw new Error(data.error);

    importQueue = data.guests.map(function(g){
      g.sent = !!g.sentAt;
      g.lang = g.lang||'en';
      return g;
    });
    selectedIdxs=[];
    statusEl.textContent = '✓ '+importQueue.length+' guests synced · '+ new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
    renderImportQueue();
  } catch(e) {
    statusEl.textContent = '✗ Error: '+e.message;
  }

  btn.textContent='⟳ Sync'; btn.disabled=false;
}

// Auto-sync on load if worker URL is saved
if(workerInput.value) {
  doSync();
}

document.getElementById('importClear').addEventListener('click', function(){
  importQueue=[]; selectedIdxs=[]; renderImportQueue();
  document.getElementById('syncStatus').style.display='none';
});

renderTracker();
</script>
