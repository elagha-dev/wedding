<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>A & E · Invite Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F3EE;--card:#FDFAF7;--ink:#2A201A;--muted:#7A6B5E;--accent:#7A5236;--al:#C4956A;--border:#E2D8CF;--green:#3d7a55;--gl:#EBF3ED;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Jost',sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:32px 14px 80px}
header{text-align:center;margin-bottom:32px}
.mono{font-family:var(--serif);font-size:38px;font-weight:300;letter-spacing:.18em;color:var(--accent);font-style:italic}
.rule{width:36px;height:1px;background:var(--al);margin:10px auto}
header h1{font-size:10px;font-weight:600;letter-spacing:.25em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--border);padding:24px 28px;width:100%;max-width:620px;box-shadow:0 2px 20px rgba(42,32,26,.06);margin-top:18px}
.slabel{font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.slabel::after{content:'';flex:1;height:1px;background:var(--border)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
input{font-family:var(--sans);font-size:14px;padding:9px 12px;border:1px solid var(--border);background:var(--bg);color:var(--ink);outline:none;width:100%;transition:border-color .18s}
input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(122,82,54,.1)}
input::placeholder{color:#c0b5aa}
.tlabel{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:9px;display:block}
.types{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px}
.tbtn{display:flex;flex-direction:column;gap:2px;padding:11px 13px;background:var(--bg);border:1.5px solid var(--border);cursor:pointer;text-align:left;transition:all .15s}
.tbtn:hover{border-color:var(--al);background:#fbf6f0}
.tbtn.on{border-color:var(--accent);background:#fbf6f0}
.tbtn-icon{font-size:17px}
.tbtn-title{font-size:11.5px;font-weight:600;color:var(--ink)}
.tbtn.on .tbtn-title{color:var(--accent)}
.tbtn-desc{font-size:10px;color:var(--muted)}
.langs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:18px}
.lbtn{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;background:var(--bg);border:1.5px solid var(--border);cursor:pointer;font-family:var(--sans);font-size:12px;font-weight:500;color:var(--muted);transition:all .15s}
.lbtn:hover{border-color:var(--al);background:#fbf6f0}
.lbtn.on{border-color:var(--accent);background:#fbf6f0;color:var(--accent)}
.genbtn{width:100%;padding:13px;background:var(--accent);color:#fbf6f0;border:none;font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;transition:background .18s}
.genbtn:hover{background:#8e6042}

/* output */
.gtag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;background:#e8e0d6;font-size:11px;font-weight:500;color:var(--muted);margin-bottom:12px}
.gtag.p{background:#f0e4d4}
.urlrow{display:flex;border:1px solid var(--border);margin-bottom:8px}
.urltext{flex:1;font-size:11px;padding:9px 12px;color:var(--muted);font-family:monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ubtn{flex-shrink:0;padding:9px 13px;border:none;font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:all .18s;white-space:nowrap}
.ubtn-copy{background:var(--ink);color:#ebe2da}
.ubtn-copy:hover{background:var(--accent)}
.ubtn-copy.ok{background:var(--green)}
.ubtn-sent{background:#e8e0d6;color:var(--muted)}
.ubtn-sent:hover{background:var(--al);color:var(--ink)}
.ubtn-sent.ok{background:var(--green);color:#fff}
.previewlink{display:block;font-size:10.5px;color:var(--muted);text-decoration:none;letter-spacing:.06em;margin-bottom:16px}
.previewlink:hover{color:var(--accent)}
.mlabel{font-size:10px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.msgbox{background:var(--bg);border:1px solid var(--border);padding:13px 15px;font-family:var(--serif);font-size:13px;line-height:1.8;color:var(--ink);white-space:pre-wrap;word-break:break-word;margin-bottom:9px;max-height:200px;overflow-y:auto}
.mactions{display:flex;gap:9px}
.mbtn{flex:1;padding:10px 12px;border:none;font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:all .18s;display:flex;align-items:center;justify-content:center;gap:6px}
.mbtn-copy{background:var(--ink);color:#ebe2da}
.mbtn-copy:hover{background:var(--accent)}
.mbtn-copy.ok{background:var(--green)}
.mbtn-wa{background:#25d366;color:#fff}
.mbtn-wa:hover{background:#1db954}

/* tracker */
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.clrbtn{font-size:11px;color:#bbb;background:none;border:none;cursor:pointer;font-family:var(--sans)}
.clrbtn:hover{color:var(--accent)}
.hlist{list-style:none}
.empty{text-align:center;padding:22px;color:var(--muted);font-size:13px;font-style:italic;font-family:var(--serif)}
.hi{padding:13px 0;border-bottom:1px solid var(--border)}
.hi:last-child{border-bottom:none}
.hitop{display:flex;align-items:center;gap:7px;margin-bottom:9px;flex-wrap:wrap}
.hiname{font-family:var(--serif);font-size:16px;color:var(--ink)}
.badges{display:flex;gap:4px;flex-wrap:wrap}
.bdg{font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;background:#ebe2da;color:var(--muted)}
.bdg.p{background:#f0e4d4;color:var(--accent)}
.bdg.c{background:#e4ebf0;color:#3a5a6e}
.bdg.s{background:var(--gl);color:var(--green)}
.hiacts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.tbtn2{padding:5px 10px;font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;border:1.5px solid var(--border);background:var(--bg);color:var(--muted);cursor:pointer;font-family:var(--sans);transition:all .15s;display:flex;align-items:center;gap:4px}
.tbtn2:hover{border-color:var(--al);color:var(--accent);background:#fbf6f0}
.tbtn2.ok{border-color:var(--green);background:var(--gl);color:var(--green)}
.himeta{font-size:10px;color:#c0b5aa;margin-top:3px}
.hiurl{font-family:monospace;font-size:9.5px;color:#c8bfb4;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Summary bar */
.sum-counts{display:flex;align-items:center;gap:14px;margin-bottom:8px;flex-wrap:wrap}
.sum-sent{font-size:12px;font-weight:600;color:var(--green)}
.sum-unsent{font-size:12px;font-weight:600;color:var(--accent)}
.sum-total{font-size:11px;color:var(--muted);margin-left:auto}
.sum-bar-wrap{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.sum-bar{height:100%;background:var(--green);border-radius:2px;transition:width .4s ease}

/* Group headers */
.group-hdr{list-style:none;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);padding:12px 0 6px;border-bottom:1.5px solid var(--accent-light)}
.group-hdr:first-child{padding-top:4px}
.group-hdr--sent{color:var(--green);border-bottom-color:var(--green)}

/* Sent items slightly muted */
.hi-sent .hiname{opacity:.6}
.hi-sent .hiurl{opacity:.5}

/* Not sent badge */
.bdg.u{background:#fdf0e8;color:#a0622a}

@media(max-width:480px){
  .row2{grid-template-columns:1fr}
  .types{grid-template-columns:1fr}
  .card{padding:18px 14px}
  .mactions{flex-direction:column}
}
</style>
</head>
<body>
<header>
  <div class="mono">A & E</div>
  <div class="rule"></div>
  <h1>Invite Generator</h1>
</header>

<div class="card" id="genCard">
  <div class="slabel">Guest Details</div>
  <div class="row2">
    <div class="fg"><label for="p1">First Guest *</label><input id="p1" type="text" placeholder="e.g. Sarah"/></div>
    <div class="fg"><label for="p2">Second Guest (couple)</label><input id="p2" type="text" placeholder="optional"/></div>
  </div>
  <div class="row2" style="margin-bottom:18px">
    <div class="fg"><label for="waPhone">WhatsApp Number</label><input id="waPhone" type="tel" placeholder="+49 176 12345678"/></div>
  </div>

  <span class="tlabel">Invite Type</span>
  <div class="types">
    <button class="tbtn on" data-type="ceremony-single"><span class="tbtn-icon">💒</span><span class="tbtn-title">Single — Ceremony</span><span class="tbtn-desc">Church only</span></button>
    <button class="tbtn" data-type="couple-ceremony"><span class="tbtn-icon">👫</span><span class="tbtn-title">Couple — Ceremony</span><span class="tbtn-desc">Church only</span></button>
    <button class="tbtn" data-type="ceremony-party-single"><span class="tbtn-icon">🎉</span><span class="tbtn-title">Single — Full Day</span><span class="tbtn-desc">Church + evening</span></button>
    <button class="tbtn" data-type="couple-party"><span class="tbtn-icon">✨</span><span class="tbtn-title">Couple — Full Day</span><span class="tbtn-desc">Church + evening</span></button>
  </div>

  <span class="tlabel">Language</span>
  <div class="langs">
    <button class="lbtn on" data-lang="en">🇬🇧 English</button>
    <button class="lbtn" data-lang="de">🇩🇪 Deutsch</button>
    <button class="lbtn" data-lang="ru">🇷🇺 Русский</button>
  </div>
  <button class="genbtn" id="genBtn">Generate Invite →</button>
</div>

<div class="card" id="outCard" style="display:none">
  <div class="slabel">Invite Link</div>
  <div id="guestTag"></div>
  <div class="urlrow">
    <div class="urltext" id="urlTxt"></div>
    <button class="ubtn ubtn-copy" id="copyLinkBtn">Copy Link</button>
    <button class="ubtn ubtn-sent" id="sentBtn">Mark Sent</button>
  </div>
  <a class="previewlink" id="previewLink" href="#" target="_blank" rel="noreferrer">↗ Open invite</a>
  <div class="mlabel">Message</div>
  <div class="msgbox" id="msgBox"></div>
  <div class="mactions">
    <button class="mbtn mbtn-copy" id="copyMsgBtn">📋 Copy Message</button>
    <button class="mbtn mbtn-wa" id="waSendBtn">💬 Send via WhatsApp</button>
  </div>
</div>

<div class="card" id="trackerCard">
  <div class="hdr">
    <div class="slabel" style="margin-bottom:0;flex:1">Tracker</div>
    <button class="clrbtn" id="clearBtn">Clear all</button>
  </div>
  <div id="trackerSummary" style="display:none;margin-bottom:14px;"></div>
  <ul class="hlist" id="hlist"></ul>
</div>

<script>
var BASE = 'https://www.arinaelnur.de/';
var selType = 'ceremony-single';
var selLang = 'en';
var cur = null; // current entry object

// ── Persistent storage: try localStorage, fall back to memory ─
var mem = [];
function load(){
  try{ var d=localStorage.getItem('wt'); return d?JSON.parse(d):[];}
  catch(e){return [];}
}
function save(){
  try{localStorage.setItem('wt',JSON.stringify(mem));}catch(e){}
}
mem = load();

// ── Messages ─────────────────────────────────────────────────
var msgs = {
  en:{
    ceremony:"Hey {n} 💛\n\nWe're getting married — and we can't imagine our church ceremony without you!\n\n📅 16 October 2026\n⛪ Doors open 13:30 · Ceremony at 14:00\n📍 Schlosskirche Düsseldorf\n\nYour personal invitation is ready — just open the link below and let us know you're coming.\n\n{u}\n\nCan't wait to see you there. ♡\nArina & Elnur",
    party:"Hey {n} 💛\n\nWe're getting married — and we can't imagine our special day without you!\n\n📅 16 October 2026\n⛪ Doors open 13:30 · Ceremony 14:00 — Schlosskirche Düsseldorf\n🎉 Evening reception from 17:00 — Rheinliebe am Deich\n\nYour personal invitation is ready — open the link and tell us you're coming.\n\n{u}\n\nSo excited to celebrate with you. ♡\nArina & Elnur"
  },
  de:{
    ceremony:"Hey {n} 💛\n\nWir heiraten — und wir können uns unsere Trauung ohne dich nicht vorstellen!\n\n📅 16. Oktober 2026\n⛪ Einlass 13:30 · Trauung 14:00 Uhr\n📍 Schlosskirche Düsseldorf\n\nDeine persönliche Einladung wartet — öffne den Link und sag uns kurz Bescheid.\n\n{u}\n\nWir freuen uns riesig auf dich. ♡\nArina & Elnur",
    party:"Hey {n} 💛\n\nWir heiraten — und wir können uns unseren besonderen Tag ohne dich nicht vorstellen!\n\n📅 16. Oktober 2026\n⛪ Einlass 13:30 · Trauung 14:00 Uhr — Schlosskirche Düsseldorf\n🎉 Abendempfang ab 17:00 Uhr — Rheinliebe am Deich\n\nDeine persönliche Einladung wartet — öffne den Link und gib uns Bescheid.\n\n{u}\n\nWir können es kaum erwarten. ♡\nArina & Elnur"
  },
  ru:{
    ceremony:"Привет, {n} 💛\n\nМы женимся — и не можем представить венчание без тебя!\n\n📅 16 октября 2026\n⛪ Двери открываются в 13:30 · Венчание в 14:00\n📍 Schlosskirche Düsseldorf\n\nТвоё личное приглашение готово — открой ссылку и дай нам знать.\n\n{u}\n\nТак ждём тебя. ♡\nАрина и Эльнур",
    party:"Привет, {n} 💛\n\nМы женимся — и не можем представить этот день без тебя!\n\n📅 16 октября 2026\n⛪ Двери в 13:30 · Венчание в 14:00 — Schlosskirche Düsseldorf\n🎉 Вечерний приём с 17:00 — Rheinliebe am Deich\n\nТвоё личное приглашение готово — открой ссылку и дай нам знать.\n\n{u}\n\nНе можем дождаться. ♡\nАрина и Эльнур"
  }
};

function buildUrl(p1,p2,type,lang){
  var q=new URLSearchParams();
  if(p1) q.set('p1',p1);
  if(p2&&(type==='couple-ceremony'||type==='couple-party')) q.set('p2',p2);
  if(type==='ceremony-party-single'||type==='couple-party') q.set('party','1');
  if(lang&&lang!=='en') q.set('lang',lang);
  return BASE+'?'+q.toString();
}

function buildMsg(name,type,lang,url){
  var hasParty=type==='ceremony-party-single'||type==='couple-party';
  var l=msgs[lang]||msgs.en;
  return (hasParty?l.party:l.ceremony).replace('{n}',name).replace('{u}',url);
}

function ts(){return new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}
function dt(){return new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' '+ts();}

// ── Type / lang selectors ─────────────────────────────────────
document.querySelectorAll('.tbtn').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('.tbtn').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on'); selType=b.dataset.type;
  });
});
document.querySelectorAll('.lbtn').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('.lbtn').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on'); selLang=b.dataset.lang;
  });
});

// ── Generate ─────────────────────────────────────────────────
document.getElementById('genBtn').addEventListener('click',function(){
  var p1=document.getElementById('p1').value.trim();
  var p2=document.getElementById('p2').value.trim();
  var phone=document.getElementById('waPhone').value.trim();
  if(!p1){
    var el=document.getElementById('p1');
    el.style.borderColor='#b0392b'; el.focus();
    setTimeout(function(){el.style.borderColor='';},1400);
    return;
  }
  var isCouple=selType==='couple-ceremony'||selType==='couple-party';
  var hasParty=selType==='ceremony-party-single'||selType==='couple-party';
  var name=isCouple&&p2?p1+' & '+p2:p1;
  var url=buildUrl(p1,p2,selType,selLang);
  var msg=buildMsg(name,selType,selLang,url);
  var ll={en:'🇬🇧 EN',de:'🇩🇪 DE',ru:'🇷🇺 RU'};

  // Find or create entry
  var idx=mem.findIndex(function(h){return h.url===url;});
  var entry;
  if(idx>-1){
    entry=mem[idx];
    entry.msg=msg;
    if(phone) entry.phone=phone;
  } else {
    entry={id:Date.now(),name:name,type:selType,lang:selLang,ll:ll[selLang]||'EN',
      url:url,msg:msg,phone:phone,isCouple:isCouple,hasParty:hasParty,
      created:dt(),tracked:{linkCopied:null,msgCopied:null,waSent:null}};
    mem.unshift(entry);
  }
  cur=entry;
  save(); renderTracker();

  // Show output
  var out=document.getElementById('outCard');
  out.style.display='block';
  document.getElementById('urlTxt').textContent=url;
  document.getElementById('previewLink').href=url;
  document.getElementById('msgBox').textContent=msg;
  document.getElementById('guestTag').innerHTML=
    '<span class="gtag'+(hasParty?' p':'')+'">'+
    (isCouple?'👫':'👤')+' '+name+
    (hasParty?' · Full day':' · Ceremony')+' · '+(ll[selLang]||'EN')+
    '</span>';

  // Reset copy buttons
  var clb=document.getElementById('copyLinkBtn');
  clb.textContent='Copy Link'; clb.classList.remove('ok');
  var cmb=document.getElementById('copyMsgBtn');
  cmb.textContent='📋 Copy Message'; cmb.classList.remove('ok');

  // Sync sent button
  var sb=document.getElementById('sentBtn');
  if(entry.tracked.waSent){sb.textContent='✓ Sent';sb.classList.add('ok');}
  else{sb.textContent='Mark Sent';sb.classList.remove('ok');}

  out.scrollIntoView({behavior:'smooth',block:'nearest'});
});

// ── Copy link ─────────────────────────────────────────────────
document.getElementById('copyLinkBtn').addEventListener('click',function(){
  var url=document.getElementById('urlTxt').textContent;
  copyText(url,this,'Copy Link');
  if(cur&&!cur.tracked.linkCopied){cur.tracked.linkCopied=ts();save();renderTracker();}
});

// ── Mark Sent toggle ──────────────────────────────────────────
document.getElementById('sentBtn').addEventListener('click',function(){
  if(!cur) return;
  if(cur.tracked.waSent){cur.tracked.waSent=null;this.textContent='Mark Sent';this.classList.remove('ok');}
  else{cur.tracked.waSent=ts();this.textContent='✓ Sent';this.classList.add('ok');}
  save(); renderTracker();
});

// ── Copy message ──────────────────────────────────────────────
document.getElementById('copyMsgBtn').addEventListener('click',function(){
  var msg=document.getElementById('msgBox').textContent;
  copyText(msg,this,'📋 Copy Message');
  if(cur&&!cur.tracked.msgCopied){cur.tracked.msgCopied=ts();save();renderTracker();}
});

// ── WhatsApp ──────────────────────────────────────────────────
document.getElementById('waSendBtn').addEventListener('click',function(){
  var msg=document.getElementById('msgBox').textContent;
  var phone=cur&&cur.phone?cur.phone:'';
  var clean=phone.replace(/[\s\-\(\)]/g,'').replace(/^\+/,'');
  var waUrl=clean
    ?'https://wa.me/'+clean+'?text='+encodeURIComponent(msg)
    :'https://wa.me/?text='+encodeURIComponent(msg);
  window.open(waUrl,'_blank');
  if(cur){cur.tracked.waSent=ts();save();renderTracker();}
  var sb=document.getElementById('sentBtn');
  sb.textContent='✓ Sent'; sb.classList.add('ok');
});

// ── Copy helper ───────────────────────────────────────────────
function copyText(text,btn,resetLabel){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){flash(btn,resetLabel);}).catch(function(){fallbackCopy(text,btn,resetLabel);});
  } else { fallbackCopy(text,btn,resetLabel); }
}
function fallbackCopy(text,btn,resetLabel){
  var ta=document.createElement('textarea');
  ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{document.execCommand('copy'); flash(btn,resetLabel);}catch(e){}
  document.body.removeChild(ta);
}
function flash(btn,resetLabel){
  var prev=btn.textContent;
  btn.textContent='✓ Copied'; btn.classList.add('ok');
  setTimeout(function(){btn.textContent=resetLabel; btn.classList.remove('ok');},2000);
}

// ── Tracker ───────────────────────────────────────────────────
function renderTracker(){
  var list=document.getElementById('hlist');
  if(!mem.length){
    document.getElementById('trackerSummary').style.display='none';
    list.innerHTML='<li class="empty">No invites yet — generate your first above ↑</li>';
    return;
  }

  var sent=mem.filter(function(h){return !!h.tracked.waSent;});
  var unsent=mem.filter(function(h){return !h.tracked.waSent;});
  var total=mem.length;

  // Summary bar
  var pct=Math.round(sent.length/total*100);
  var sumEl=document.getElementById('trackerSummary');
  sumEl.style.display='block';
  sumEl.innerHTML=
    '<div class="sum-counts">'+
      '<span class="sum-sent">✓ Sent <strong>'+sent.length+'</strong></span>'+
      '<span class="sum-unsent">⏳ Not sent <strong>'+unsent.length+'</strong></span>'+
      '<span class="sum-total">'+total+' total</span>'+
    '</div>'+
    '<div class="sum-bar-wrap"><div class="sum-bar" style="width:'+pct+'%"></div></div>';

  function renderGroup(items, startIdx){
    return items.map(function(h){
      var i=mem.indexOf(h);
      var t=h.tracked||{};
      function mkbtn(key,icon,label){
        var done=!!t[key];
        return '<button class="tbtn2'+(done?' ok':'')+'" data-i="'+i+'" data-k="'+key+'">'+
          icon+' '+(done?'✓ '+label+' <span style="opacity:.6;font-size:8px">'+t[key]+'</span>':label)+
          '</button>';
      }
      return '<li class="hi'+(t.waSent?' hi-sent':'')+'">'+
        '<div class="hitop"><span class="hiname">'+h.name+'</span>'+
          '<span class="badges">'+
            (h.isCouple?'<span class="bdg c">Couple</span>':'')+
            (h.hasParty?'<span class="bdg p">Full Day</span>':'')+
            '<span class="bdg">'+(h.ll||'EN')+'</span>'+
            (t.waSent?'<span class="bdg s">Sent ✓</span>':'<span class="bdg u">Not sent</span>')+
          '</span></div>'+
        '<div class="hiacts">'+
          mkbtn('linkCopied','🔗','Link Copied')+
          mkbtn('msgCopied','📋','Msg Copied')+
          mkbtn('waSent','💬','WA Sent')+
          '<button class="tbtn2" data-i="'+i+'" data-resend="1">📤 Resend WA</button>'+
        '</div>'+
        (h.phone?'<div class="himeta">📱 '+h.phone+'</div>':'')+
        '<div class="hiurl">'+h.url+'</div>'+
        '<div class="himeta">Generated '+h.created+'</div>'+
      '</li>';
    }).join('');
  }

  var html='';
  if(unsent.length){
    html+='<li class="group-hdr">⏳ Not yet sent ('+unsent.length+')</li>';
    html+=renderGroup(unsent);
  }
  if(sent.length){
    html+='<li class="group-hdr group-hdr--sent">✓ Sent ('+sent.length+')</li>';
    html+=renderGroup(sent);
  }
  list.innerHTML=html;

  // Track buttons
  list.querySelectorAll('.tbtn2[data-k]').forEach(function(b){
    b.addEventListener('click',function(){
      var i=parseInt(this.dataset.i),k=this.dataset.k;
      var e=mem[i]; if(!e) return;
      e.tracked[k]=e.tracked[k]?null:ts();
      // Sync output card sent button if this is the current entry
      if(cur&&cur.url===e.url&&k==='waSent'){
        var sb=document.getElementById('sentBtn');
        if(e.tracked.waSent){sb.textContent='✓ Sent';sb.classList.add('ok');}
        else{sb.textContent='Mark Sent';sb.classList.remove('ok');}
      }
      save(); renderTracker();
    });
  });

  // Resend
  list.querySelectorAll('.tbtn2[data-resend]').forEach(function(b){
    b.addEventListener('click',function(){
      var i=parseInt(this.dataset.i);
      var e=mem[i]; if(!e) return;
      var clean=(e.phone||'').replace(/[\s\-\(\)]/g,'').replace(/^\+/,'');
      var waUrl=clean
        ?'https://wa.me/'+clean+'?text='+encodeURIComponent(e.msg)
        :'https://wa.me/?text='+encodeURIComponent(e.msg);
      window.open(waUrl,'_blank');
      e.tracked.waSent=ts();
      save(); renderTracker();
    });
  });
}

// ── Clear ─────────────────────────────────────────────────────
document.getElementById('clearBtn').addEventListener('click',function(){
  if(!mem.length) return;
  if(confirm('Clear all tracker history?')){
    mem=[]; cur=null; save(); renderTracker();
    document.getElementById('outCard').style.display='none';
  }
});

renderTracker();
</script>
</body>
</html>
